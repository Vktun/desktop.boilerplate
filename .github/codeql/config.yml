name: "Custom CodeQL Configuration"

queries:
  - uses: security-and-quality

paths:
  - 'src'
  - 'prismModules'
  - 'dbpframework'

paths-ignore:
  - '**/bin/**'
  - '**/obj/**'
  - '**/*.g.cs'
  - '**/*.g.i.cs'
  - '**/*.Designer.cs'
  - '**/GeneratedInternalTypeHelper.g.cs'
  - 'test/**'
  - 'docs/**'
  - '.github/**'
